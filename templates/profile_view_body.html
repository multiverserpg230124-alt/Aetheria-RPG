<div class="perfilu">
  <div class="pder">
    <tope>
      <name>{USERNAME}</name>
      <rang>{POSTER_RANK}</rang>
    </tope>

    <div class="lefty">
      <limp>
        <!-- BEGIN profile_field -->
        <!-- BEGIN profil_type_user_posts -->
        <a rel="nofollow" href="/sta/{PUSERNAME}">Sus Temas</a>
        <a rel="nofollow" href="/spa/{PUSERNAME}">Sus Mensajes</a>
        <!-- END profil_type_user_posts -->
        <!-- END profile_field -->

        <!-- BEGIN contact_field -->
        {contact_field.CONTENT}
        <!-- END contact_field -->
      </limp>

      <datos>
        <!-- BEGIN profile_field -->
        <div id="field_id{profile_field.ID}">
          <dt>{profile_field.LABEL}</dt>
          <dd>{profile_field.CONTENT}</dd>
        </div>
        <!-- END profile_field -->
      </datos>

      <timm>
        <lst>{LAST_VISIT_TIME}</lst>
        <onl>{USER_ONLINE}</onl>
      </timm>
    </div>

    <bottum></bottum>
  </div>

  <div class="pizq">
    <div class="minime"></div>

    <div class="avase">
      {AVATAR_IMG}
    </div>
  </div>
</div>

<script src="{JQUERY_ROOT}json/jquery.json-1.3.min.js" type="text/javascript"></script>

<script type="text/javascript">
//<![CDATA[
$(document).ready(function () {
  $('[id^=field_id]').each(function () {
    if ($(this).find('.field_editable').is('span, div')) {
      $(this).hover(
        function () {
          if ($(this).find('.field_editable.invisible').is('span, div')) {
            $(this)
              .find('.field_editable')
              .prev()
              .addClass('ajax-profil_hover')
              .parent()
              .addClass('ajax-profil_parent')
              .append('<div class="ajax-profil_edit"><img src="{AJAX_EDIT_IMG}" /></div>');

            $(this)
              .find('.ajax-profil_edit')
              .attr({
                alt: "{L_FIELD_EDIT_VALUE}",
                title: "{L_FIELD_EDIT_VALUE}"
              })
              .click(function () {
                $(this)
                  .prev()
                  .prev()
                  .removeClass('ajax-profil_hover')
                  .addClass('invisible')
                  .next()
                  .removeClass('invisible')
                  .append('<img src="{AJAX_VALID_IMG}" class="ajax-profil_valid" />')
                  .find('input,select');

                $(this)
                  .prev()
                  .find('.ajax-profil_valid')
                  .attr({
                    alt: "{L_VALIDATE}",
                    title: "{L_VALIDATE}"
                  })
                  .click(function () {
                    var content = new Array();

                    $(this)
                      .parent()
                      .find('[name]')
                      .each(function () {
                        var type_special = $(this).is(
                          'input[type=radio],input[type=checkbox]'
                        );

                        if ((type_special && $(this).is(':checked')) || !type_special) {
                          content.push(
                            new Array($(this).attr('name'), $(this).attr('value'))
                          );
                        }
                      });

                    var id_name = $(this).parents('[id^=field_id]').attr('id');
                    var id = id_name.substring(8, id_name.length);

                    $.post(
                      "{U_AJAX_PROFILE}",
                      {
                        id: id,
                        user: "{CUR_USER_ID}",
                        active: "{CUR_USER_ACTIVE}",
                        content: $.toJSON(content),
                        tid: "{TID}"
                      },
                      function (data) {
                        $.each(data, function (i, item) {
                          $('[id=field_id' + i + ']')
                            .find('.field_uneditable')
                            .html(item)
                            .end()
                            .find('.ajax-profil_valid')
                            .remove()
                            .end()
                            .find('.field_editable')
                            .addClass('invisible')
                            .end()
                            .find('.field_uneditable')
                            .removeClass('invisible');
                        });
                      },
                      "json"
                    );
                  });

                $(this).remove();
              });
          }
        },
        function () {
          if ($(this).find('.field_editable.invisible').is('span, div')) {
            $(this).find('.field_editable').prev().removeClass('ajax-profil_hover');
            $(this).find('.ajax-profil_edit').remove();
          }
        }
      );
    }
  });
});
//]]>
</script>

<script type="text/javascript">
//<![CDATA[
$(function () {
  /* Conserva el color del grupo del usuario en el perfil. */
  $('name span').each(function () {
    var memberColour = $(this).css('color');

    $(this)
      .parents('.perfilu')
      .attr('style', '--pj:' + memberColour + ';');
  });

  /* Conserva tu configuración actual de Mini Icono e Inventario. */
  $('div.perfilu').each(function () {
    $(this).find('bottum').prepend($(this).find('div#field_id5'));
    $(this).find('.minime').prepend($(this).find('div#field_id4'));
  });

  /* Convierte la barra lateral en enlaces de texto.
     Así se eliminan todos los iconos y las URLs largas. */
  $('.perfilu limp').each(function () {
    var barra = $(this);
    var enlaces = barra.find('a');

    var enlaceTemas = enlaces.filter('[href^="/sta/"]').first();
    var enlaceMensajes = enlaces.filter('[href^="/spa/"]').first();

    var enlacePrivado = enlaces.filter(function () {
      var href = ($(this).attr('href') || '').toLowerCase();
      var imagen = ($(this).find('img').attr('src') || '').toLowerCase();

      return href.indexOf('privmsg') !== -1 ||
        imagen.indexOf('icon_contact_pm') !== -1;
    }).first();

    var enlaceBaul = enlaces.filter(function () {
      var href = ($(this).attr('href') || '').toLowerCase();
      var imagen = ($(this).find('img').attr('src') || '').toLowerCase();

      return href.indexOf('baul') !== -1 ||
        imagen.indexOf('box') !== -1;
    }).first();

    var enlaceLista = enlaces.filter(function () {
      var href = ($(this).attr('href') || '').toLowerCase();
      var imagen = ($(this).find('img').attr('src') || '').toLowerCase();

      return href.indexOf('lista') !== -1 ||
        imagen.indexOf('icon_contact_www') !== -1;
    }).first();

    /* Si Foroactivo entrega los dos campos como enlaces externos,
       el primero es Lista Estrellada y el segundo es Baúl. */
    var enlacesExternos = enlaces.filter(function () {
      var href = ($(this).attr('href') || '').toLowerCase();

      return href.indexOf('http://') === 0 ||
        href.indexOf('https://') === 0;
    });

    if (!enlaceLista.length && enlacesExternos.length) {
      enlaceLista = enlacesExternos.eq(0);
    }

    if (!enlaceBaul.length && enlacesExternos.length > 1) {
      enlaceBaul = enlacesExternos.eq(1);
    }

    /* Borra imágenes, iconos y enlaces mostrados como URL. */
    barra.empty();

    /* Añade cada texto conservando su enlace original. */
    function agregarEnlace(origen, texto) {
      var enlaceNuevo = $('<a>', {
        text: texto,
        title: ''
      });

      if (origen && origen.length && origen.attr('href')) {
        enlaceNuevo.attr('href', origen.attr('href'));
      } else {
        /* Si no hay enlace configurado, el texto sigue visible,
           pero no redirige a otra página. */
        enlaceNuevo.attr('href', '#').on('click', function (evento) {
          evento.preventDefault();
        });
      }

      barra.append(enlaceNuevo);
    }

   /* El orden está invertido porque la barra usa transform: scale(-1). */
    agregarEnlace(enlaceMensajes, 'Sus  Mensajes');
    agregarEnlace(enlaceTemas, 'Sus  Temas');
    agregarEnlace(enlacePrivado, 'Enviar  Mensaje  Privado');
    agregarEnlace(enlaceLista, 'Lista   Estrellada');
    agregarEnlace(enlaceBaul, 'Baúl');
  });
});
//]]>
</script>
